[workspace]
resolver = "2"
members = [
    "crates/meshsexcel-core",
    "crates/meshsexcel-net",
    "crates/meshsexcel-node",
    "poc-b-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "ACL-1.0"
authors = ["GreenChennai"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rusqlite = { version = "0.31", features = ["bundled"] }
libp2p = { version = "0.53.2", features = [
  "tcp",
  "noise",
  "yamux",
  "mdns",
  "gossipsub",
  "identify",
  "macros",
  "serde",
  "tokio",
] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
calamine = "0.26"
rust_xlsxwriter = "0.79"
csv = "1.3"

[profile.release]
lto = "thin"
codegen-units = 16
