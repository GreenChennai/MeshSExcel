<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshSExcel — 局域网协同表格</title>
<link rel="stylesheet" href="/vendor/luckysheet/plugins/css/pluginsCss.css">
<link rel="stylesheet" href="/vendor/luckysheet/plugins/plugins.css">
<link rel="stylesheet" href="/vendor/luckysheet/css/luckysheet.css">
<link rel="stylesheet" href="/vendor/luckysheet/assets/iconfont/iconfont.css">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318a303' stroke-width='2'%3E%3Crect x='3' y='3' width='18' height='18' rx='2'/%3E%3Cpath d='M3 9h18M3 15h18M9 3v18'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <!-- 顶栏:协同状态与文档切换(Luckysheet 自带完整表格工具区) -->
  <header class="topbar">
    <div class="tb-left">
      <span class="brand" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      </span>
      <span class="brand-name">MeshSExcel</span>
      <select id="docSel" class="doc-select" aria-label="切换文档" disabled></select>
      <button class="chrome-btn" id="newDocBtn" title="新建文档" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        新建
      </button>
    </div>
    <div class="tb-right">
      <span class="save-state" id="saveState"></span>
      <button class="chrome-btn" id="historyBtn" title="审计历史(block 链)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        审计历史
      </button>
      <button class="chrome-btn" id="snapshotBtn" title="快照与恢复" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14l1.5 13h-17z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>
        快照
      </button>
      <span class="chip" id="nodeChip" title="本节点身份">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span id="nodeIdText">—</span>
      </span>
      <button class="chrome-btn" id="peersBtn" aria-label="局域网节点" title="局域网节点">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.2c2.9.3 5.5 2.3 5.5 5.3"/></svg>
        <span id="peersCount">1 节点</span>
      </button>
    </div>
  </header>

  <!-- Luckysheet 表格区(工具栏/名称框/编辑栏/网格/工作表栏/统计栏均为 Luckysheet 内置) -->
  <main class="lucky-wrap">
    <div id="emptyState" class="empty-state">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      <h2>还没有文档</h2>
      <p>新建一个工作簿,局域网内的其他 MeshSExcel 节点会自动发现并同步它。</p>
      <button class="pri-btn" id="emptyNewBtn">新建第一个文档</button>
    </div>
    <iframe id="luckyFrame" class="lucky-host" src="/sheet.html" title="表格编辑区"></iframe>
  </main>

  <footer class="statusbar">
    <span id="syncState">—</span>
    <span class="spring"></span>
    <span class="st-dim">编辑直接上链:每次变更生成签名 block 并通过 gossip 同步到局域网</span>
  </footer>
</div>

<!-- 抽屉:历史 / 节点 / 快照 -->
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="面板" aria-modal="true" hidden>
  <header class="drawer-head">
    <h2 id="drawerTitle">面板</h2>
    <button class="chrome-btn" id="drawerClose" aria-label="关闭面板">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>

<script src="/vendor/luckysheet/jquery.min.js"></script>
<script src="/vendor/luckysheet/plugins/js/plugin.js"></script>
<script src="/vendor/luckysheet/luckysheet.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
