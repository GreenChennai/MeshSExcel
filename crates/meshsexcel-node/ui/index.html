<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshSExcel — 局域网协同表格</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318a303' stroke-width='2'%3E%3Crect x='3' y='3' width='18' height='18' rx='2'/%3E%3Cpath d='M3 9h18M3 15h18M9 3v18'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">

  <!-- ═══ 标题栏 ═══ -->
  <header class="titlebar">
    <div class="tb-left">
      <span class="brand" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      </span>
      <span class="brand-name">MeshSExcel</span>
      <span class="doc-name" id="docName">未打开文档</span>
      <span class="save-state" id="saveState"></span>
    </div>
    <div class="tb-right">
      <span class="chip" id="nodeChip" title="本节点身份">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span id="nodeIdText">—</span>
      </span>
      <button class="chrome-btn" id="peersBtn" aria-label="局域网节点" title="局域网节点">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.2c2.9.3 5.5 2.3 5.5 5.3"/></svg>
        <span id="peersCount">1 节点</span>
      </button>
    </div>
  </header>

  <!-- ═══ 功能区选项卡 ═══ -->
  <nav class="ribbon-tabs" role="tablist" aria-label="功能区">
    <button class="rtab active" data-tab="start" role="tab" aria-selected="true">开始</button>
    <button class="rtab" data-tab="insert" role="tab" aria-selected="false">插入</button>
    <button class="rtab" data-tab="formula" role="tab" aria-selected="false">公式</button>
    <button class="rtab" data-tab="data" role="tab" aria-selected="false">数据</button>
    <button class="rtab" data-tab="view" role="tab" aria-selected="false">视图</button>
  </nav>

  <!-- ═══ 功能区面板 ═══ -->
  <div class="ribbon" id="ribbon">
    <!-- 开始 -->
    <div class="rpanel active" data-panel="start">
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="copyBtn" title="复制 (Ctrl+C)">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制
          </button>
          <button class="rbtn" id="pasteBtn" title="粘贴 (Ctrl+V)">
            <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>粘贴
          </button>
          <button class="rbtn" id="clearContentsBtn" title="清除内容 (Del)">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l1 13h9l1-13"/></svg>清除
          </button>
        </div>
        <div class="rcap">剪贴板</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn rbtn-icon" id="boldBtn" title="加粗 (Ctrl+B)" aria-label="加粗">
            <svg viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg>
          </button>
          <div class="dd">
            <button class="rbtn rbtn-icon dd-btn" id="fontColorBtn" title="字体颜色" aria-label="字体颜色">
              <svg viewBox="0 0 24 24"><path d="M6 20L12 4l6 16M8.5 14h7"/></svg>
              <span class="color-underline" id="fontColorUnderline"></span>
            </button>
          </div>
          <div class="dd">
            <button class="rbtn rbtn-icon dd-btn" id="fillColorBtn" title="填充颜色" aria-label="填充颜色">
              <svg viewBox="0 0 24 24"><path d="M9 3l10.5 10.5a2 2 0 0 1 0 2.8l-4.2 4.2a2 2 0 0 1-2.8 0L4 12V7z"/><path d="M20 17s2 2.2 2 3.6a2 2 0 1 1-4 0c0-1.4 2-3.6 2-3.6z"/></svg>
              <span class="color-underline" id="fillColorUnderline"></span>
            </button>
          </div>
        </div>
        <div class="rcap">字体</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn rbtn-icon" id="alignLeftBtn" title="左对齐" aria-label="左对齐">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
          </button>
          <button class="rbtn rbtn-icon" id="alignCenterBtn" title="居中" aria-label="居中">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M4 18h16"/></svg>
          </button>
          <button class="rbtn rbtn-icon" id="alignRightBtn" title="右对齐" aria-label="右对齐">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M4 18h16"/></svg>
          </button>
        </div>
        <div class="rcap">对齐方式</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="autoSumBtn" title="对上方连续数字求和">
            <svg viewBox="0 0 24 24"><path d="M18 7l-6 5 6 5M6 7v10"/></svg>自动求和
          </button>
          <button class="rbtn" id="sortHintBtn" title="说明:排序将在后续版本提供" disabled>
            <svg viewBox="0 0 24 24"><path d="M7 4v13m0 0l-3-3m3 3l3-3M17 20V7m0 0l-3 3m3-3l3 3"/></svg>排序
          </button>
        </div>
        <div class="rcap">编辑</div>
      </div>
      <div class="rgroup rgrow"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="newDocBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新建文档
          </button>
        </div>
        <div class="rcap">文档</div>
      </div>
    </div>

    <!-- 插入 -->
    <div class="rpanel" data-panel="insert">
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="addSheetBtn">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>新建工作表
          </button>
        </div>
        <div class="rcap">工作表</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="importXlsxBtn">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>导入 XLSX
          </button>
          <button class="rbtn" id="importCsvBtn">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>导入 CSV
          </button>
        </div>
        <div class="rcap">导入</div>
      </div>
      <div class="rgroup rgrow"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="snapshotBtn">
            <svg viewBox="0 0 24 24"><path d="M5 7h14l1.5 13h-17z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>快照与恢复
          </button>
        </div>
        <div class="rcap">备份</div>
      </div>
    </div>

    <!-- 公式 -->
    <div class="rpanel" data-panel="formula">
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" data-fn="SUM">Σ 求和</button>
          <button class="rbtn" data-fn="AVERAGE">x̄ 平均</button>
          <button class="rbtn" data-fn="COUNT">计数</button>
          <button class="rbtn" data-fn="MAX">最大</button>
          <button class="rbtn" data-fn="MIN">最小</button>
        </div>
        <div class="rcap">函数库(插入到当前单元格)</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="funcHelpBtn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-.9 1-.9 1.7"/><circle cx="12" cy="17" r=".5"/></svg>支持的函数
          </button>
        </div>
        <div class="rcap">帮助</div>
      </div>
    </div>

    <!-- 数据 -->
    <div class="rpanel" data-panel="data">
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="exportXlsxBtn">
            <svg viewBox="0 0 24 24"><path d="M12 15V3m0 12l-4-4m4 4l4-4M4 21h16"/></svg>导出 XLSX
          </button>
          <button class="rbtn" id="exportCsvBtn">
            <svg viewBox="0 0 24 24"><path d="M12 15V3m0 12l-4-4m4 4l4-4M4 21h16"/></svg>导出 CSV
          </button>
        </div>
        <div class="rcap">导出</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <button class="rbtn" id="historyBtn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>审计历史(block 链)
          </button>
        </div>
        <div class="rcap">审计</div>
      </div>
    </div>

    <!-- 视图 -->
    <div class="rpanel" data-panel="view">
      <div class="rgroup">
        <div class="rbtns">
          <label class="rtoggle"><input type="checkbox" id="showFormulaChk"> 显示公式</label>
        </div>
        <div class="rcap">显示</div>
      </div>
      <div class="rsep"></div>
      <div class="rgroup">
        <div class="rbtns">
          <label class="rlabel">缩放</label>
          <select id="zoomSel" class="rselect" aria-label="缩放比例">
            <option value="0.8">80%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
          </select>
        </div>
        <div class="rcap">缩放</div>
      </div>
    </div>
  </div>

  <!-- ═══ 名称框 + 编辑栏 ═══ -->
  <div class="editbar">
    <input class="name-box" id="nameBox" type="text" value="" aria-label="名称框" spellcheck="false" autocomplete="off">
    <span class="fx" aria-hidden="true">fx</span>
    <input class="formula-input" id="formulaInput" type="text" autocomplete="off" spellcheck="false"
           placeholder="输入内容或 = 公式(如 =SUM(A1:A9))" aria-label="编辑栏" disabled>
  </div>

  <!-- ═══ 网格 ═══ -->
  <main class="sheet-viewport" id="gridWrap" tabindex="0" aria-label="表格编辑区">
    <div id="emptyState" class="empty-state">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      <h2>还没有文档</h2>
      <p>新建一个工作簿,局域网内的其他 MeshSExcel 节点会自动发现并同步它。</p>
      <button class="btn btn-primary" id="emptyNewBtn">新建第一个文档</button>
    </div>
    <div id="gridHost" class="grid-host" hidden>
      <table class="grid" id="gridTable" role="grid"></table>
    </div>
    <input class="cell-editor" id="cellEditor" type="text" autocomplete="off" spellcheck="false" hidden>
  </main>

  <!-- ═══ 工作表标签 ═══ -->
  <div class="sheetbar">
    <div class="sheet-tabs" id="sheetTabs" role="tablist" aria-label="工作表"></div>
    <button class="sheet-add" id="addSheetQuick" aria-label="新增工作表" title="新增工作表">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="sheetbar-spring"></div>
  </div>

  <!-- ═══ 状态栏 ═══ -->
  <footer class="statusbar">
    <span class="st-mode" id="modeCell">就绪</span>
    <span class="st-sep"></span>
    <span class="st-stats" id="selStats"></span>
    <span class="spring"></span>
    <span class="st-sync" id="syncState">—</span>
    <span class="st-sep"></span>
    <button class="zoom-btn" id="zoomOut" aria-label="缩小">−</button>
    <span class="zoom-val" id="zoomVal">100%</span>
    <button class="zoom-btn" id="zoomIn" aria-label="放大">+</button>
  </footer>
</div>

<!-- 抽屉:历史 / 节点 / 快照 -->
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="面板" aria-modal="true" hidden>
  <header class="drawer-head">
    <h2 id="drawerTitle">面板</h2>
    <button class="chrome-btn" id="drawerClose" aria-label="关闭面板">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 右键菜单 -->
<div class="ctx-menu" id="ctxMenu" role="menu" hidden></div>

<!-- 颜色选择浮层 -->
<div class="color-pop" id="colorPop" hidden></div>

<!-- 对话框 / 轻提示 -->
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>

<script src="/app.js"></script>
</body>
</html>
